<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The sheet – lilypoint</title>
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
<style>
	body { font-family: 'Fraunces', Georgia, serif; font-size: 16px; line-height: 1.5; background: var(--bg-2); }
	.desk { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 28px; max-width: 1180px; margin: 0 auto; padding: 28px 20px 160px; }
	.sheet { background: var(--bg); border: 1px solid var(--ui-2); box-shadow: 0 1px 0 var(--ui-3), 0 12px 30px -18px rgba(16, 15, 15, 0.35); padding: 56px 56px 72px; min-height: 80vh; position: relative; }
	.sheet .heading { text-align: center; margin-bottom: 18px; }
	.sheet .heading input { background: none; border: 0; text-align: center; width: 100%; font-family: inherit; color: var(--tx); }
	.sheet .heading input:focus { outline: none; }
	.sheet .heading input.t { font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
	.sheet .heading input.c { font-size: 1rem; font-style: italic; color: var(--tx-2); }
	.sheet .heading .rule { width: 48px; height: 1px; background: var(--tx-3); margin: 10px auto 0; }
	.score { min-height: 200px; }
	.score .page { margin-bottom: 8px; }
	.score .page svg { width: 100%; height: auto; }
	.score.busy { opacity: 0.45; }
	.status { position: absolute; top: 18px; right: 22px; font-style: italic; color: var(--tx-2); font-size: 0.9rem; }
	.blank { color: var(--tx-3); font-style: italic; text-align: center; padding: 80px 0; }
	.score .playing { fill: var(--cy); color: var(--cy); }

	aside { font-size: 0.95rem; }
	aside h2 { font-weight: 400; font-size: 1rem; margin: 6px 0 12px; color: var(--tx-2); font-style: italic; }
	.margin { list-style: none; margin: 0 0 24px; padding: 0; }
	.margin li { padding: 8px 0; border-top: 1px solid var(--ui-2); }
	.margin li:last-child { border-bottom: 1px solid var(--ui-2); }
	.margin .lbl { display: block; }
	.margin .acts { display: flex; gap: 12px; margin-top: 2px; }
	.margin button { background: none; border: 0; padding: 0; color: var(--tx-2); font: inherit; font-style: italic; cursor: pointer; }
	.margin button:hover { color: var(--tx); text-decoration: underline; }
	aside .brand { display: block; font-weight: 600; text-decoration: none; color: var(--tx); margin-bottom: 20px; }
	aside .brand small { font-weight: 300; margin-left: 6px; color: var(--tx-2); }
	.exports { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
	.exports button { background: none; border: 0; padding: 0; color: var(--gr); font: inherit; cursor: pointer; }
	.exports button:hover { text-decoration: underline; }

	/* the pen tray: everything you need to add the next phrase */
	.tray { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--bg); border: 1px solid var(--ui-3); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 30px -14px rgba(16, 15, 15, 0.4); max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
	.tray label { display: inline-flex; flex-direction: column; font-size: 0.7rem; color: var(--tx-2); gap: 2px; }
	.tray select, .tray input { background: var(--bg-2); border: 1px solid var(--ui-3); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 0.95rem; color: var(--tx); }
	.tray input { width: 4.5em; }
	.tray .add { background: var(--tx); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; align-self: flex-end; }
	.tray .add:hover { background: var(--base-800); }
	:root[data-theme='dark'] .tray .add:hover, .dark .tray .add:hover { background: var(--base-300); }
	.tray .sep { width: 1px; height: 32px; background: var(--ui-3); align-self: flex-end; }
	.tray .ghost { background: none; border: 1px solid var(--ui-3); border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; align-self: flex-end; }
	.tray .ghost:hover { border-color: var(--tx-3); }
	@media (max-width: 820px) { .desk { grid-template-columns: 1fr; } .sheet { padding: 28px 18px 48px; } }
	@media print { body { background: white; } .desk { display: block; padding: 0; } .sheet { border: 0; box-shadow: none; padding: 0; } aside, .tray, .status { display: none; } }
</style>
</head>
<body>
<div class="desk">
	<main class="sheet">
		<div class="status" id="status"></div>
		<div class="heading">
			<input class="t" id="title" value="Exercises in counterpoint" aria-label="Title" />
			<input class="c" id="composer" value="lilypoint" aria-label="Composer" />
			<div class="rule"></div>
		</div>
		<div class="score" id="score" role="img" aria-label="Engraved score"></div>
		<p class="blank" id="blank" hidden>Nothing on the page yet. Use the tray below to add the first phrase.</p>
	</main>
	<aside class="no-print">
		<a class="brand" href="index.html">lilypoint <small>the sheet</small></a>
		<span id="theme"></span>
		<h2>On this page</h2>
		<ol class="margin" id="margin"></ol>
		<h2>Take it with you</h2>
		<div class="exports">
			<button id="pdf">Download PDF</button>
			<button id="print">Print</button>
			<button id="ly">LilyPond source</button>
			<button id="xml">MusicXML</button>
			<button id="midi">MIDI</button>
		</div>
	</aside>
</div>
<div class="tray no-print" role="toolbar" aria-label="Next phrase">
	<label>Key <select id="key"></select></label>
	<label>Mode <select id="mode"></select></label>
	<label>Species <select id="species"></select></label>
	<label>Bars <input id="measures" type="number" min="2" max="16" value="4" /></label>
	<label>Meter <select id="time"></select></label>
	<button class="add" id="add">Add phrase</button>
	<span class="sep"></span>
	<button class="ghost" id="play">Play</button>
</div>

<script type="module">
import { KEYS, MODES, TIME_SIGS, SPECIES, generate, randomSeed, defaultSpec, toLilyPond, readUrlState, writeUrlState, downloadText, safeFilename, describe } from './shared/core.js';
import { toMusicXML } from './shared/notation.js';
import { renderScore, timedNotes, midiBlob } from './shared/render-verovio.js';
import { Player } from './shared/playback.js';
import { printSvgs, downloadPdf } from './shared/pdf.js';
import { el, options, initTheme, themeButton, debounce } from './shared/ui.js';

initTheme();
document.getElementById('theme').replaceWith(themeButton());
const $ = id => document.getElementById(id);
options($('key'), KEYS, 'C'); options($('mode'), MODES, 'major'); options($('time'), TIME_SIGS, '4/4');
options($('species'), SPECIES.map(s => ({ value: s.n, label: s.name.toLowerCase() })), 1);

let phrases = [];
let engraved = null; // { toolkit, pages }
const player = new Player();
const meta = () => ({ title: $('title').value, composer: $('composer').value });

function traySpec() { return { key: $('key').value, mode: $('mode').value, species: Number($('species').value), measures: Number($('measures').value), time: $('time').value, seed: randomSeed() }; }

function marginNotes() {
	$('margin').replaceChildren(...phrases.map((r, i) => el('li', {},
		el('span', { class: 'lbl' }, `${i + 1}. ${describe(r.spec)}`),
		el('span', { class: 'acts' },
			el('button', { type: 'button', onclick: () => replace(i, { ...r.spec, seed: randomSeed() }) }, 'reroll'),
			el('button', { type: 'button', onclick: () => { if (i > 0) { [phrases[i - 1], phrases[i]] = [phrases[i], phrases[i - 1]]; engrave(); } } }, 'up'),
			el('button', { type: 'button', onclick: () => { phrases.splice(i, 1); engrave(); } }, 'remove')))));
	$('blank').hidden = phrases.length > 0;
}

const engrave = debounce(async () => {
	marginNotes();
	writeUrlState(phrases.map(p => p.spec), { t: meta().title, c: meta().composer });
	if (!phrases.length) { $('score').replaceChildren(); engraved = null; return; }
	$('score').classList.add('busy');
	$('status').textContent = 'engraving';
	try {
		engraved = await renderScore($('score'), phrases, { meta: { ...meta(), upperName: '', lowerName: '', upperAbbr: '', lowerAbbr: '' }, scale: 42, paged: false, font: 'Leipzig', header: 'none', onProgress: t => { $('status').textContent = t; } });
		$('status').textContent = '';
	} catch (e) { $('status').textContent = 'Could not engrave: ' + e.message; }
	$('score').classList.remove('busy');
}, 60);

function replace(i, spec) {
	try { phrases[i] = generate(spec); engrave(); }
	catch (e) { $('status').textContent = 'No counterpoint found for those settings. Try again. (' + e.message + ')'; }
}
function add(spec) {
	try { phrases.push(generate(spec)); engrave(); }
	catch (e) { $('status').textContent = 'No counterpoint found for those settings. Try again. (' + e.message + ')'; }
}

$('add').addEventListener('click', () => add(traySpec()));
$('play').addEventListener('click', () => {
	if (player.playing) { player.stop(); $('play').textContent = 'Play'; return; }
	if (!engraved) return;
	// Verovio's own timemap drives both the sound and the highlight.
	const notes = timedNotes(engraved.toolkit);
	const ctx = player.ensure();
	const t0 = ctx.currentTime + 0.1;
	for (const n of notes) player.tone(n.midi, t0 + n.on / 1000, (n.off - n.on) / 1000);
	$('play').textContent = 'Stop';
	player.playing = true;
	const end = Math.max(...notes.map(n => n.off)) / 1000;
	let lit = new Set();
	const tick = () => {
		if (!player.playing) return;
		const ms = (ctx.currentTime - t0) * 1000;
		const now = new Set(notes.filter(n => ms >= n.on && ms < n.off).map(n => n.id));
		for (const id of lit) if (!now.has(id)) { const g = document.getElementById(id); g && g.classList.remove('playing'); }
		for (const id of now) if (!lit.has(id)) { const g = document.getElementById(id); g && g.classList.add('playing'); }
		lit = now;
		if (ms / 1000 > end + 0.2) { player.playing = false; $('play').textContent = 'Play'; for (const id of lit) { const g = document.getElementById(id); g && g.classList.remove('playing'); } return; }
		player.raf = requestAnimationFrame(tick);
	};
	player.raf = requestAnimationFrame(tick);
});
$('pdf').addEventListener('click', async () => { if (!engraved) return; try { await downloadPdf(engraved.pages, { filename: safeFilename(meta().title) + '.pdf', onePerPage: true, title: meta().title }); } catch (e) { $('status').textContent = 'Direct PDF failed (' + e.message + '); opening print instead.'; printSvgs(engraved.pages, { title: '' }); } });
$('print').addEventListener('click', () => engraved && printSvgs(engraved.pages, { title: '' }));
$('ly').addEventListener('click', async () => downloadText(safeFilename(meta().title) + '.ly', await toLilyPond(phrases, meta())));
$('xml').addEventListener('click', () => downloadText(safeFilename(meta().title) + '.musicxml', toMusicXML(phrases, meta()), 'application/vnd.recordare.musicxml+xml'));
$('midi').addEventListener('click', () => { if (!engraved) return; const a = document.createElement('a'); a.href = URL.createObjectURL(midiBlob(engraved.toolkit)); a.download = safeFilename(meta().title) + '.mid'; a.click(); });
for (const id of ['title', 'composer']) $(id).addEventListener('input', engrave);

const { specs, params } = readUrlState();
if (params.get('t')) $('title').value = params.get('t');
if (params.get('c')) $('composer').value = params.get('c');
for (const s of specs.length ? specs : [defaultSpec()]) add(s);
</script>
</body>
</html>
