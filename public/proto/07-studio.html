<!doctype html>
<!-- Prototype 07: editable engraved sheet, with live phrase controls. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>The writing room · lilypoint</title><link rel="stylesheet" href="shared/studio.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span>♮</span>lilypoint</a><nav class="nav"><a class="active" href="07-studio.html">Write</a><a href="08-lessons.html">Practice</a></nav><div class="top-end"><span id="theme"></span><button id="ly">LilyPond</button><button id="midi">MIDI</button><button id="pdf" class="primary">Download PDF</button></div></header>
<div class="workspace"><aside class="margin"><h2>Your phrases <span id="phrase-count" class="muted"></span></h2><div id="phrases"></div><button id="add" class="wide">+ Add phrase</button><p class="margin-note">Select a phrase to edit it below.<br>Drag phrases to change their order.<br><br><kbd>Space</kbd> play / stop<br><kbd>R</kbd> reroll selected<br><kbd>N</kbd> add a phrase</p><button id="print" class="quiet wide">Print sheet</button></aside>
<main class="desk"><div class="desk-label"><span>THE WRITING ROOM</span><span id="summary"></span></div><div class="paper"><div class="paper-title"><input id="title" aria-label="Piece title" value="A little counterpoint" maxlength="100"><input id="composer" aria-label="Composer" value="Studies for two voices" maxlength="100"></div><div id="sheet"></div></div></main></div>
<section class="editor" aria-label="Phrase editor"><div class="editor-head"><strong id="editing"></strong><span class="muted">Every change writes itself onto the sheet.</span><button id="toggle-editor" aria-expanded="false" aria-controls="editor-controls">Settings</button><button id="reroll" class="quiet">↻ Reroll phrase</button></div><div id="editor-controls"><div id="species" class="pills-row"></div><div id="keys" class="pills-row"></div><div class="pills-row"><div id="modes" class="pills-row"></div><div id="bars" class="pills-row"></div><div id="meter" class="pills-row"></div></div></div>
<div class="transport"><button id="play" class="primary">▶ Play phrase</button><button id="play-all">Play sheet</button><label>♩ <input id="tempo" aria-label="Tempo" type="number" min="30" max="200" value="80"></label><select id="hands" aria-label="Voices"><option value="both">Both voices</option><option value="upper">Counterpoint</option><option value="lower">Cantus firmus</option></select><label><input id="countin" type="checkbox">Count in</label><label><input id="loop" type="checkbox">Loop</label><span id="status" role="status">Ready</span></div></section>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.7.0/dist/abcjs-basic-min.js"></script><script type="module" src="shared/writing-room.js"></script></body></html>
